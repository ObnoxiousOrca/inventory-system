name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1 # REPLACE: match terraform/terraform.tfvars
  ECR_REPOSITORY: inventory-backend # REPLACE: terraform output -raw ecr_repository_name
  EC2_INSTANCE_ID: i-08aff518487606e8a # REPLACE: terraform output -raw ec2_instance_id
  BACKEND_API_URL: http://ec2-13-233-64-77.ap-south-1.compute.amazonaws.com # REPLACE: http:// + terraform output -raw ec2_public_dns
  FRONTEND_ORIGIN: http://inventory-frontend-166828110108.s3-website.ap-south-1.amazonaws.com # REPLACE: terraform output -raw frontend_url
  FRONTEND_BUCKET: inventory-frontend-166828110108 # REPLACE: terraform output -raw frontend_bucket_name

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install and test backend
        working-directory: backend
        run: |
          npm ci
          npm test
      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3
        name: Set up QEMU
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3
        name: Set up Docker Buildx

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            -f docker/Dockerfile \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            ./backend

      - name: Build and upload frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ env.BACKEND_API_URL }}
        run: |
          npm ci
          npm run build
          aws s3 sync dist "s3://$FRONTEND_BUCKET" --delete

      - name: Deploy backend through Systems Manager
        env:
          IMAGE_TAG: ${{ github.sha }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          PARAMETERS=$(jq -cn \
            --arg tag "$IMAGE_TAG" \
            --arg region "$AWS_REGION" \
            --arg registry "$REGISTRY" \
            --arg origin "$FRONTEND_ORIGIN" \
            '{
              commands: [
                "set -euo pipefail",
                "sudo mkdir -p /opt/inventory",
                "sudo chown \"$(whoami)\" /opt/inventory",
                "cd /opt/inventory",
                "aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $registry,
                "sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=" + $tag + "/' .env",
                "sed -i '/^CORS_ORIGINS=/d' backend.env && printf '\\nCORS_ORIGINS=%s\\n' " + ($origin | @sh) + " >> backend.env",
                "docker compose --profile backend pull backend",
                "docker compose --profile backend up -d backend nginx",
                "for attempt in $(seq 1 30); do if curl --fail --silent http://127.0.0.1/health; then exit 0; fi; sleep 2; done; docker compose logs --tail=100 backend; exit 1"
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy inventory backend ${IMAGE_TAG}" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)
          echo "SSM command: $COMMAND_ID"

          for attempt in $(seq 1 60); do
            if STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null); then
              echo "SSM deployment status: $STATUS"
              case "$STATUS" in
                Success)
                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$EC2_INSTANCE_ID" \
                    --query "StandardOutputContent" \
                    --output text
                  exit 0
                  ;;
                Failed|TimedOut|Cancelled|Cancelling|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated)
                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$EC2_INSTANCE_ID" \
                    --query "{stdout:StandardOutputContent,stderr:StandardErrorContent}" \
                    --output json
                  exit 1
                  ;;
              esac
            fi
            sleep 10
          done

          echo "Timed out waiting for SSM command $COMMAND_ID to finish."
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "{status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}" \
            --output json || true
          exit 1
