name: CI/CD

# Runs tests on every push/PR; deploys only on pushes to main.
on:
  push:
    branches: [main]
  pull_request:

# Needed for GitHub -> AWS authentication via OIDC (no long-lived AWS keys stored in GitHub).
permissions:
  id-token: write
  contents: read

env:
  # PLACEHOLDERS: must match your Terraform values (see `terraform output`).
  AWS_REGION: ap-south-1                    # REPLACE: your AWS region
  ECR_REPOSITORY: inventory-backend         # REPLACE: terraform output ecr_repository_name
  ECS_CLUSTER: inventory-cluster            # REPLACE: terraform output ecs_cluster_name
  ECS_SERVICE: inventory-backend-service    # REPLACE: terraform output ecs_service_name
  ECS_TASK_FAMILY: inventory-backend        # REPLACE: terraform output ecs_task_family
  CONTAINER_NAME: backend                   # must match the container name in terraform/main.tf
  FRONTEND_BUCKET: inventory-frontend-REPLACE_ME   # REPLACE: terraform output frontend_bucket_name
  CLOUDFRONT_DISTRIBUTION_ID: REPLACE_ME    # REPLACE: terraform output frontend_distribution_id

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install and test backend
        working-directory: backend
        run: |
          npm ci
          npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # REPLACE: add repo secret AWS_DEPLOY_ROLE_ARN = terraform output github_actions_role_arn
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -f docker/Dockerfile -t "$REGISTRY/$ECR_REPOSITORY:$TAG" ./backend
          docker push "$REGISTRY/$ECR_REPOSITORY:$TAG"
          echo "image=$REGISTRY/$ECR_REPOSITORY:$TAG" >> "$GITHUB_OUTPUT"

      # Reuse the task definition Terraform created and only swap the image.
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition > task-definition.json

      - name: Render task definition with the new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.image }}

      - name: Deploy to ECS (Fargate)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      # Frontend deploy: API requests use the same CloudFront origin via /api/*.
      - name: Build and upload frontend
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          npm ci
          npm run build
          aws s3 sync dist "s3://$FRONTEND_BUCKET" --delete
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/index.html"
